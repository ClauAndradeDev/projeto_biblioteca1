{% extends "base.html" %}

{% block conteudo %}

<h2>Alunos Cadastrados</h2>

    <a href="/alunos/novo">Cadastrar novo aluno</a>
</br>
<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Série</th>
            <th>Turma</th>
            <th>Telefone</th>
        </tr>
    </thead>

    <tbody>
        {% for aluno in alunos %}
        <tr>
            <td>{{ aluno.id_aluno }}</td>
            <td>{{ aluno.nome }}</td>
            <td>{{ aluno.serie }}</td>
            <td>{{ aluno.turma }}</td>
            <td>{{ aluno.telefone }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
